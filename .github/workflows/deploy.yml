name: Verificação da estrutura base
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: verificacao-${{ github.ref }}
  cancel-in-progress: true
jobs:
  ci:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      TEST_REDIS_URL: redis://127.0.0.1:6379/15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm compliance
      - run: pnpm test:compliance
      - run: pnpm ai-marks
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm docs:check
      - run: pnpm build
# Deploy permanece no EasyPanel. Nenhum reset/SSH/PM2 é executado por este workflow.
# Produção exige backup e revisão conforme a base antes de promover a branch.
